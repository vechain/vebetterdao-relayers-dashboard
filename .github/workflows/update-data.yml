name: Update Dashboard Data

on:
  workflow_dispatch:
  schedule:
    # Every 6 hours (UTC)
    - cron: "0 */6 * * *"
    # Shortly after the Monday round rollover.
    # Deliberately a single run: a full analysis takes far longer than the 10-minute
    # spacing the old burst used, so the extra jobs could never deliver a faster refresh —
    # they just overlapped each other and lost the race to push.
    - cron: "40 6 * * 1"

# One run at a time. Without this, overlapping runs each commit against a main that another
# run has already moved, and every loser dies on `! [rejected] main -> main (fetch first)`.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run analytics script
        run: |
          yarn analyze-auto-voting \
            --checkpoint public/data/report.json \
            --output public/data/report.json

      - name: Commit and push if report changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/report.json
          if git diff --staged --quiet; then
            echo "No changes to report.json"
          else
            git commit -m "chore: update auto-voting report [skip ci]"
            # Analysis takes hours; main may well have moved. Rebase rather than fail.
            git pull --rebase --autostash
            git push
          fi
